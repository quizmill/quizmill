name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI only reads the repo and runs untrusted PR code (npm lifecycle scripts,
# build, tests). Drop the token to read-only so a malicious PR can't use it
# to write to the repo, regardless of the repository's default permission.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Version stamping reads the latest release tag (git describe).
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      # Runs after the unit tests so the demo pack is already seeded
      # (the `pretest` hook runs ensure-pack) — typecheck needs the active
      # pack's JSON for the variant's static imports.
      - name: Typecheck
        run: npm run typecheck

      - name: Build static export (demo pack)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ''

      # Cache the browser download, keyed on the locked Playwright version;
      # the system libraries aren't cacheable, so install-deps always runs.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E (demo pack)
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

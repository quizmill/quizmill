name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Version stamping derives the patch from `git rev-list --count HEAD`,
          # so the full history is required.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build static export (demo pack)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ''

      - name: E2E (demo pack)
        run: npx vitest run --config vitest.e2e.config.ts

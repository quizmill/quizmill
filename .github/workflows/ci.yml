name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Version stamping reads the latest release tag (git describe).
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      # Runs after the unit tests so the demo pack is already seeded
      # (the `pretest` hook runs ensure-pack) — typecheck needs the active
      # pack's JSON for the variant's static imports.
      - name: Typecheck
        run: npm run typecheck

      - name: Build static export (demo pack)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ''

      - name: E2E (demo pack)
        run: npx vitest run --config vitest.e2e.config.ts

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# CI only reads the repo and runs untrusted PR code (npm lifecycle scripts,
# build, tests). Drop the token to read-only so a malicious PR can't use it
# to write to the repo, regardless of the repository's default permission.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Version stamping reads the latest release tag (git describe).
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build static export (demo pack)
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ''

      - name: E2E (demo pack)
        run: npx vitest run --config vitest.e2e.config.ts

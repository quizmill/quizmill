name: Deploy apps

# Rebuild every known pack app on the LATEST published engine and
# publish it to Cloudflare Pages, so engine improvements roll out to the
# live demo + showcase apps automatically — no per-app babysitting.
#
# Each app is built with `npx quizmill@<version> build <pack>` (the same
# path users run), so the deployed version always matches the published
# CLI/engine — the CLI stamps NEXT_PUBLIC_APP_VERSION, so there is no
# git-describe race. The version is PINNED to the latest vX.Y.Z git tag
# rather than `@latest`: the Release workflow npm-publishes the CLI and
# then tags the merge commit, so after a release the latest tag is the
# just-published engine. Pinning the exact version (and waiting for it to
# land on npm) sidesteps the dist-tag propagation race that `@latest`
# loses right after a release — it would silently rebuild on the PREVIOUS
# engine, which is why every release used to need a manual re-dispatch.
# Triggers:
#   - after the Release workflow completes (a new engine version shipped)
#   - daily (picks up content changes in the separate pack repos)
#   - manual dispatch
#
# Deliberately NOT here: the private eleven-plus app. It carries licensed
# (© GL Assessment) content, is local-only, and deploys from its own
# (private) pack repo. Don't add it.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN     token with "Cloudflare Pages — Edit"
#   CLOUDFLARE_ACCOUNT_ID    70b494550992cda97e893fab035f7e9a

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-apps
  cancel-in-progress: false

jobs:
  deploy:
    # For workflow_run, only deploy when the Release run actually succeeded
    # (an unmerged PR close leaves its job skipped → conclusion != success).
    # schedule / workflow_dispatch always run.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: try
            pack: content/pack-demo
            app: solar-system-demo-app
            project: quizmill-try
          - name: claude-cert
            pack: quizmill/pack-claude-cert
            app: claude-cert-app
            project: quizmill-claude-cert
          - name: world-capitals
            pack: quizmill/pack-world-capitals
            app: world-capitals-app
            project: world-capitals
    steps:
      # fetch-depth: 0 brings the tags so we can pin the build to the
      # released engine version. The checkout also puts the bundled demo
      # pack (content/pack-demo) on disk for the "try" build; the remote
      # packs are fetched by the CLI from their own repos.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pin to the latest vX.Y.Z tag (= the just-published engine) instead
      # of @latest, and wait for that exact version to be installable —
      # npm publish returns before the registry/CDN has fully propagated,
      # so @latest can still resolve to the previous version right after a
      # release. Pin + wait makes the post-release auto-deploy reliable and
      # removes the manual re-dispatch. No tag (fresh repo) → @latest.
      - name: Resolve engine version
        id: engine
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "::notice::No version tag found — falling back to quizmill@latest."
            echo "spec=latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${tag#v}"
          for i in $(seq 1 24); do
            if npm view "quizmill@$version" version >/dev/null 2>&1; then
              echo "quizmill@$version is available on npm."
              echo "spec=$version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for quizmill@$version to propagate to npm ($i/24)…"
            sleep 5
          done
          echo "::error::quizmill@$version never appeared on npm after ~2 min."
          exit 1

      - name: Build "${{ matrix.name }}" on quizmill@${{ steps.engine.outputs.spec }}
        run: npx --yes quizmill@${{ steps.engine.outputs.spec }} build ${{ matrix.pack }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ matrix.app }} --project-name ${{ matrix.project }} --branch=main

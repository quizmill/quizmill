name: Deploy preview (try app)

# Branch preview of the DEMO ("try") app, built from THIS branch's working
# tree — not the published npm engine — so unreleased engine changes (e.g.
# the social layer) can be exercised on a real URL before they ship.
#
# Deployed to the quizmill-try Cloudflare Pages project on a non-production
# branch, which Cloudflare serves at a preview URL
# (https://<branch>.quizmill-try.pages.dev) without touching the live
# try.quizmill.dev production deployment.
#
# Social features need a Supabase project: set the TRY_SUPABASE_URL and
# TRY_SUPABASE_PUBLISHABLE_KEY repo secrets (the publishable key is safe to
# expose — it's the browser anon key). Without them the preview still builds
# and deploys, just with social dormant. Cloudflare deploy is skipped until
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are present.
#
# NOTE: for magic-link sign-in to work on the preview URL, add it to the
# Supabase project's Auth → URL Configuration → Redirect URLs.

on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags → in-app version stamp via git describe

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Builds the bundled demo pack (prebuild seeds content/pack). Served at
      # the domain root, so no base path.
      - name: Build try app from this branch
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TRY_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TRY_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy preview to Cloudflare Pages
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy out --project-name quizmill-try
            --branch=${{ github.ref_name }}

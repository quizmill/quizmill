name: PR preview

# Deploy a Cloudflare Pages PREVIEW of the demo-pack app for every PR, so
# UI/feature changes can be clicked through before merge. Unlike
# deploy-apps.yml (which rebuilds on the PUBLISHED engine), this builds the
# PR's OWN code (npm run build → out/) and deploys it to the quizmill-try
# project on a per-PR branch — a Cloudflare Pages *preview*, never
# production (production is the `main` branch deploy in deploy-apps.yml).
#
# Reuses the existing repo secrets (no new setup):
#   CLOUDFLARE_API_TOKEN   token with "Cloudflare Pages — Edit"
#   CLOUDFLARE_ACCOUNT_ID  70b494550992cda97e893fab035f7e9a

on:
  pull_request:
    branches: [main]
    # Include label events so toggling `preview:stress-pack` rebuilds the
    # preview on (or off) the large stress pack. `types` replaces the
    # default set, so the usual three must be listed too.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write # upsert the preview-URL comment
  deployments: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Secrets aren't exposed to PRs from forks — skip cleanly rather than
    # fail with an empty token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true # version stamping reads git describe

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Opt-in: label the PR `preview:stress-pack` to deploy the preview on a
      # large synthetic pack instead of the demo, so loading states (tap
      # spinner + quiz skeleton) are actually perceptible. Generated +
      # activated here; prebuild's ensure-pack leaves an active pack alone.
      - name: Activate stress pack (labelled PRs only)
        if: contains(github.event.pull_request.labels.*.name, 'preview:stress-pack')
        run: npm run pack:stress

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ''

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name quizmill-try --branch=pr-${{ github.event.pull_request.number }}

      - name: Comment the preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}';
            const marker = '<!-- pr-preview -->';
            const stress = context.payload.pull_request.labels
              .some((l) => l.name === 'preview:stress-pack');
            const packLine = stress
              ? 'Built on the large synthetic **stress pack** (~2000 questions) so loading states are perceptible — open a category and watch for the tap spinner and quiz skeleton.'
              : 'Built from this PR on the bundled solar-system demo pack.';
            const body = `${marker}\n### 🚀 Preview — pack app\n\n**${url}**\n\n${packLine} Refreshes on every push.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

name: Release

# Label-driven semver, TAG-ONLY — releases never commit to main.
#
# Merging a PR into main cuts a release:
#   release:major / release:minor — explicit bumps
#   (no label)                    — patch
#   release:skip                  — no release (docs, CI tweaks, ...)
# Direct pushes to main never release; run this workflow manually
# (workflow_dispatch) to release accumulated commits.
#
# Versions live in git tags (vX.Y.Z), not package.json — the manifests
# carry a 0.0.0-dev sentinel and the build stamps the real version from
# `git describe` (see next.config.ts). A release = compute next version
# from the latest tag + bump, npm-publish cli/ at that version (bumped
# in the CI workspace only), tag the merge commit, create the GitHub
# release. npm publish needs an NPM_TOKEN repo secret (granular
# automation token with bypass-2FA); until it's set, that step skips
# with a notice. Publish runs before tagging so a rejected publish
# burns nothing — just rerun.

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  id-token: write # npm --provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Resolve bump from PR labels
        id: bump
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          DISPATCH_BUMP: ${{ inputs.bump }}
        run: |
          if [ -n "$DISPATCH_BUMP" ]; then
            bump="$DISPATCH_BUMP"
          elif [[ " $LABELS " == *" release:skip "* ]]; then
            bump=skip
          elif [[ " $LABELS " == *" release:major "* ]]; then
            bump=major
          elif [[ " $LABELS " == *" release:minor "* ]]; then
            bump=minor
          else
            bump=patch
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "Resolved bump: $bump (labels: ${LABELS:-none})"

      - uses: actions/checkout@v4
        if: steps.bump.outputs.bump != 'skip'
        with:
          ref: main
          fetch-depth: 0 # tags + history for git describe

      - name: Compute next version from the latest tag
        if: steps.bump.outputs.bump != 'skip'
        id: version
        run: |
          if git describe --tags --exact-match HEAD 2>/dev/null; then
            echo "::notice::HEAD is already tagged — nothing to release."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
          IFS=. read -r maj min pat <<< "${latest#v}"
          case "${{ steps.bump.outputs.bump }}" in
            major) next="v$((maj+1)).0.0" ;;
            minor) next="v$maj.$((min+1)).0" ;;
            patch) next="v$maj.$min.$((pat+1))" ;;
          esac
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Releasing $latest -> $next"

      - uses: actions/setup-node@v4
        if: steps.version.outputs.version != ''
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish CLI to npm
        if: steps.version.outputs.version != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN secret not set — skipping npm publish. Publish cli/ manually or add the secret."
            exit 0
          fi
          cd cli
          # Workspace-only version stamp; never committed back.
          npm version "${VERSION#v}" --no-git-tag-version
          npm publish --provenance --access public

      - name: Tag and create the GitHub release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$VERSION" -m "$VERSION"
          git push origin "refs/tags/$VERSION"
          gh release create "$VERSION" --generate-notes

      # Tell the personal-app pack repos a new engine shipped, so they
      # rebuild on it immediately (they also have a daily cron as a floor).
      # The built-in GITHUB_TOKEN can't reach other repos — this uses a
      # fine-grained PAT (PACK_DISPATCH_TOKEN) with Contents:write on the
      # pack repos. The exact version rides in the payload so each pack pins
      # it and waits out npm propagation (see deploy-pack.yml). Missing token
      # → skip with a notice; the packs' daily cron still picks it up.
      - name: Fan out engine-update to pack repos
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.PACK_DISPATCH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::PACK_DISPATCH_TOKEN not set — skipping fan-out (packs will rebuild on their daily cron)."
            exit 0
          fi
          for repo in quizmill/pack-claude-cert quizmill/pack-eleven-plus; do
            echo "Dispatching engine-update (${VERSION#v}) to $repo"
            jq -nc --arg v "${VERSION#v}" \
              '{event_type:"engine-update",client_payload:{version:$v}}' \
              | gh api -X POST "/repos/$repo/dispatches" --input -
          done
